# Oracle XE 21c (로컬) — 멀티 DB
#   ① 통합 DB : 계정 WOW        (Database/oracle/01_create_user.sql)
#   ② 모션 DB : 계정 WOW_MOTION (Database/oracle/02_create_motion_user.sql)
# ① 통합 DB
spring:
  datasource:
    url: ${WOW_DB_URL:jdbc:oracle:thin:@localhost:1521/XEPDB1}
    username: ${WOW_DB_USER:wow}
    password: ${WOW_DB_PASSWORD:wow1234}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 10

# ② 모션 DB — 같은 Oracle XE 의 별도 계정 WOW_MOTION (Database/oracle/02_create_motion_user.sql 로 생성)
#    다른 서버의 Oracle 을 쓰려면 WOW_MOTION_DB_URL 만 바꾸면 된다.
wow:
  motion:
    datasource:
      url: ${WOW_MOTION_DB_URL:jdbc:oracle:thin:@localhost:1521/XEPDB1}
      username: ${WOW_MOTION_DB_USER:wow_motion}
      password: ${WOW_MOTION_DB_PASSWORD:wow1234}
      driver-class-name: oracle.jdbc.OracleDriver
      hikari:
        maximum-pool-size: 5
