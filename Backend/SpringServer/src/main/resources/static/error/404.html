<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>오류 · War of Wizards</title>
  <!-- 어떤 주소에서 열려도 깨지지 않도록 절대 경로(/css/...) 사용 -->
  <link rel="stylesheet" href="/css/common.css" />
  <link rel="stylesheet" href="/css/pages.css" />
</head>
<body data-code="404">
  <!-- 에러 페이지: error.html?code=503&msg=메시지&from=lobby
       Spring 이 없는 주소(404)는 error/404.html, 서버 오류는 error/5xx.html 을 보여준다 (내용 동일) -->
  <div class="screen center">
    <div class="bg bg-red"></div>
    <div class="particles" id="err-particles"></div>

    <div class="card corners error-card stage">
      <div class="error-rune" id="err-rune">✦</div>
      <div class="error-code" id="err-code">500</div>
      <h1 class="display" style="font-size:1.6rem;color:var(--purple-100)" id="err-title">오류</h1>
      <p class="dim" style="font-size:1.05rem;line-height:1.6" id="err-desc"></p>
      <div class="row gap-s hidden" style="font-size:.9rem;color:var(--purple-400)" id="err-live"></div>
      <div class="row wrap" style="justify-content:center;margin-top:8px">
        <button class="btn btn-primary btn-sm" id="btn-retry">다시 시도</button>
        <button class="btn btn-ghost btn-sm" id="btn-back">이전 화면</button>
        <a class="btn btn-secondary btn-sm" id="btn-home" href="/lobby.html">로비로</a>
      </div>
      <div class="error-detail" id="err-detail"></div>
    </div>
  </div>
  <script src="/js/error-page.js"></script>
</body>
</html>
