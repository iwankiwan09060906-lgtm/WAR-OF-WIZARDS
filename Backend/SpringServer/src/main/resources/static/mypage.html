<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>마이페이지 · War of Wizards</title>
  <link rel="stylesheet" href="css/common.css" />
  <link rel="stylesheet" href="css/pages.css" />
</head>
<body>
  <!-- 캔버스 3 · 마이페이지 (전적/승률) -->
  <div class="shell">
    <div class="bg bg-top"></div>
    <div data-particles="12"></div>
    <header class="shell-header">
      <div>
        <div class="eyebrow">War of Wizards</div>
        <h2 class="glow-text-purple">마이페이지</h2>
      </div>
      <div class="right"><a href="lobby.html" class="btn btn-ghost btn-sm">← 로비</a></div>
    </header>

    <main class="shell-body">
      <div class="mypage-grid max-1300">
        <div class="col gap-m">
          <!-- 프로필 카드 -->
          <section class="panel col" style="align-items:center">
            <div class="avatar hex-clip" id="avatar">?</div>
            <div class="row gap-s">
              <div class="display" style="font-weight:700;font-size:1.5rem;color:var(--purple-100)" id="nickname">…</div>
              <button id="btn-edit-nick" class="btn btn-ghost btn-xs" title="닉네임 변경">변경</button>
            </div>
            <form id="nick-form" class="row hidden" style="width:100%">
              <input id="nick-input" class="text-input grow" maxlength="12" placeholder="새 닉네임" aria-label="새 닉네임" />
              <button class="btn btn-primary btn-sm" type="submit">저장</button>
              <button class="btn btn-ghost btn-sm" type="button" id="btn-nick-cancel">취소</button>
            </form>
            <div class="pill" id="tier-pill"></div>
            <div id="ring"></div>
            <div class="grid-3" style="width:100%">
              <div class="stat-box"><b id="st-total">0</b><span>전체</span></div>
              <div class="stat-box"><b id="st-wins">0</b><span>승</span></div>
              <div class="stat-box"><b id="st-losses">0</b><span>패</span></div>
            </div>
          </section>

          <!-- 비밀번호 변경 (PUT /api/auth/password) -->
          <section class="panel col">
            <div class="label">비밀번호 변경</div>
            <form id="pw-form" class="col gap-s">
              <input class="text-input" type="password" name="current" placeholder="현재 비밀번호" autocomplete="current-password" required />
              <input class="text-input" type="password" name="next" placeholder="새 비밀번호 (6자 이상)" autocomplete="new-password" minlength="6" required />
              <input class="text-input" type="password" name="confirm" placeholder="새 비밀번호 확인" autocomplete="new-password" required />
              <button class="btn btn-ghost btn-sm" type="submit">비밀번호 변경</button>
            </form>
          </section>

          <!-- 전적 분석 -->
          <section class="panel col">
            <div class="label" id="analysis-title">전적 분석</div>
            <div class="row wrap gap-s" id="recent-wl"></div>
            <div class="grid-2" style="gap:12px">
              <div class="stat-box"><b id="avg-dur">-</b><span>평균 플레이 시간</span></div>
              <div class="stat-box"><b id="avg-casts">-</b><span>평균 시전 횟수</span></div>
            </div>
          </section>
        </div>

        <div class="col gap-l" style="min-width:0">
          <section class="panel">
            <div class="between" style="margin-bottom:16px">
              <span class="label">내 덱 (HUD 슬롯 순서)</span>
              <a href="spellbook.html" class="btn btn-ghost btn-sm">덱 편성</a>
            </div>
            <div id="deck"></div>
          </section>

          <section class="panel">
            <div class="between" style="margin-bottom:12px">
              <span class="label">최근 대전</span>
              <select id="mode-filter" class="text-input" style="padding:4px 12px;font-size:.9rem" aria-label="모드 필터">
                <option value="">전체</option>
                <option value="ranked">랭킹전</option>
                <option value="friendly">친선전</option>
                <option value="bot">봇 연습</option>
              </select>
            </div>
            <div id="matches" class="divided"><div class="dim">불러오는 중…</div></div>
          </section>
        </div>
      </div>
    </main>
  </div>

  <script src="js/data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/pages/mypage.js"></script>
</body>
</html>
