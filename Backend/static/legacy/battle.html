<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>전투 · War of Wizards</title>
  <link rel="stylesheet" href="css/common.css" />
  <link rel="stylesheet" href="css/pages.css" />
  <link rel="stylesheet" href="css/battle.css" />
</head>
<body>
  <!-- 캔버스 12 · 인게임 전투 HUD
       조작: 슬롯 클릭 또는 1~8 시전 / ←→(A·D) 열 이동 / 조준 중 Q·W·E 또는 열 클릭 / Esc 조준 취소 -->
  <div class="screen battle" id="battle">
    <div class="bg bg-battle"></div>
    <div data-particles="10"></div>

    <!-- 상단 중앙: 시간 / 웨이브 / 강화 -->
    <div class="hud-top">
      <div class="hud-box row gap-l" style="padding:12px 32px">
        <div class="text-center"><div class="hud-cap">경과</div><div class="display tabular" style="font-weight:700;font-size:1.5rem;color:var(--cyan-300)" id="t-time">0:00</div></div>
        <div class="vline"></div>
        <div class="text-center"><div class="hud-cap">웨이브</div><div class="display" style="font-weight:700;font-size:1.5rem;color:var(--purple-100)" id="t-wave">0</div></div>
        <div class="vline"></div>
        <div class="text-center"><div class="hud-cap" id="t-phase-cap">강화 0단계</div><div class="display tabular" style="font-weight:700;font-size:1.1rem;color:var(--amber)" id="t-phase">다음 5:00</div></div>
      </div>
      <div class="afk-warn hidden" role="alert" id="afk"></div>
    </div>

    <!-- 좌상단: 내 방어 계층 -->
    <div class="hud-box hud-tl col gap-s">
      <div class="between"><span class="hud-title">내 방어 계층</span><span class="tier-tag" id="my-tier"></span></div>
      <div id="my-bars"></div>
      <div class="hud-small dim" id="my-tier-desc"></div>
      <div class="hud-small warn" id="my-atk"></div>
    </div>

    <!-- 우상단: 적 -->
    <div class="hud-box hud-tr col gap-s" style="border-color:rgba(127,29,29,.5)">
      <div class="between"><span class="hud-title truncate" style="color:#f87171" id="foe-name">Bot</span><span class="tier-tag" id="foe-tier"></span></div>
      <div id="foe-bars"></div>
      <div class="hud-small" style="color:rgba(252,165,165,.8)" id="foe-ratio"></div>
      <div class="row wrap gap-s" id="foe-chips"></div>
    </div>

    <!-- 중앙: 3열 전장 -->
    <div class="field-area">
      <div class="grid-2" style="gap:24px" id="unit-bars"></div>
      <div class="lanes" id="lanes"></div>
      <div class="center gap-m dim" style="font-size:.9rem">
        <span>← → 스냅 이동 (현재 <b class="ok" id="my-col">중</b>)</span>
        <button class="mini-btn" id="btn-left" aria-label="왼쪽 열로 이동">◀</button>
        <button class="mini-btn" id="btn-right" aria-label="오른쪽 열로 이동">▶</button>
      </div>
    </div>

    <!-- 하단 좌: 내 HP / 상태효과 -->
    <div class="hud-box hud-bl col gap-s">
      <div id="my-hp"></div>
      <div class="hud-small" style="color:var(--purple-500)" id="my-regen"></div>
      <div class="row wrap gap-s" style="min-height:24px" id="my-chips"></div>
    </div>

    <!-- 하단 중앙: 로그 + 8 슬롯 -->
    <div class="hud-bottom">
      <div id="log" class="log"></div>
      <div class="slots" id="slots"></div>
      <div class="hud-small warn hidden" id="deck-note">저장된 덱이 없어 임시 덱으로 진행 중입니다. (마법서에서 편성하세요)</div>
    </div>

    <!-- 하단 우: 시전 상태 머신 -->
    <div class="hud-box hud-br col" style="gap:6px">
      <div class="hud-title" style="margin-bottom:4px">시전 상태</div>
      <div id="stages"></div>
      <div class="hud-small" style="min-height:40px;margin-top:8px;line-height:1.4" id="cast-hint"></div>
    </div>

    <div class="vignette hidden" id="vignette"></div>

    <!-- 개발용 QA 패널 (localhost 또는 ?dev=1 일 때만) -->
    <div class="qa hidden" id="qa">
      <b>DEV · QA</b>
      <div class="row" style="gap:4px"><button data-speed="1">×1</button><button data-speed="5">×5</button><button data-speed="20">×20</button></div>
      <button id="qa-afk">AFK 경고 테스트</button>
      <button id="qa-dc">연결 끊김</button>
      <button id="qa-win">강제 승리</button>
    </div>

    <div class="end-overlay hidden" id="end">
      <div class="display" id="end-title" style="font-weight:900;font-size:4.5rem"></div>
      <div id="end-reason" style="font-size:1.25rem;color:var(--purple-200)"></div>
      <div id="end-save" class="dim"></div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/battleSim.js"></script>
  <script src="js/pages/battle-view.js"></script>
  <script src="js/pages/battle.js"></script>
</body>
</html>
